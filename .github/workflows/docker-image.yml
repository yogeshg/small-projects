name: Build devcontainer image

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated list of Python packages to install in the devcontainer'
        required: true
        default: 'numpy,pandas'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write Dockerfile
        run: |
          cat > Dockerfile <<'EOM'
          FROM mcr.microsoft.com/devcontainers/python:3.11
          ARG PYTHON_PACKAGES
          RUN pip install --no-cache-dir \
              ${PYTHON_PACKAGES}
          EOM

      - name: Build devcontainer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/devcontainer:latest
          build-args: |
            PYTHON_PACKAGES=${{ github.event.inputs.packages }}
